# Every example is compiled and run against a real broker on every push.
#
# This is the whole reason the repository can be trusted. Examples rot: the
# library moves on, the example does not, and a newcomer's first experience is a
# build error. Running them here turns that into a red build instead.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The library can change without this repository changing at all, so the
  # examples are also run on a schedule. A weekly failure here is how we find
  # out that a released version broke something the documentation still claims.
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    name: run the examples (rabbitmq ${{ matrix.broker }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both brokers the library supports. 0.7.2 stopped assuming 3.13 worked
        # and started running the library's own suite against it, and an
        # examples repository that only ever sees 4.x is back to assuming -- on
        # the half of the range a reader is more likely to have in production,
        # because it is the older one.
        #
        # fail-fast is off because the two legs answer different questions. A
        # failure on 3.13 with 4.x green says "this example needs a newer
        # broker", which is a finding; cancelling the other leg turns it back
        # into "something went wrong somewhere".
        broker: ['4-alpine', '3.13-alpine']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Installed so that advanced/06-tracing can build: it is a module of
          # its own and needs 1.25, because telemetry/otel raised its floor when
          # it took OpenTelemetry 1.46.
          #
          # This is NOT a relaxation of the promise below. Everything else still
          # has to build on the oldest toolchain the library supports, and the
          # next step proves it with that toolchain rather than this one. An
          # example that needs a newer Go than the library is an example
          # somebody cannot run, which is why the one that genuinely does was
          # moved out of the root module instead of raising the floor for the
          # other eighteen.
          go-version: '1.25'

      - name: Check the formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: The root module still builds on the oldest toolchain
        # The promise, checked rather than asserted. GOTOOLCHAIN fetches the
        # real 1.23 and builds with it, so this fails if anything in the root
        # module starts needing something newer -- including a dependency that
        # raises its own floor, which is exactly how tracing came to need 1.25.
        run: |
          declared=$(grep -E "^go [0-9]" go.mod | awk '{print $2}')
          if [ "$declared" != "1.23.0" ]; then
            echo "::error::the root module declares go $declared; the examples target 1.23"
            exit 1
          fi
          GOTOOLCHAIN=go1.23.0 go build ./...
          GOTOOLCHAIN=go1.23.0 go vet ./...

      - name: Build and vet
        run: |
          go build ./...
          go vet ./...

      - name: Build and vet the tracing example
        # Its own module, so nothing above reaches it. Left unbuilt it would rot
        # exactly like the examples this repository exists to keep honest.
        working-directory: advanced/06-tracing
        run: |
          go build ./...
          go vet ./...

      - name: Start a broker
        run: |
          docker run -d --name broker \
            -e HOME=/tmp \
            -p 5672:5672 \
            rabbitmq:${{ matrix.broker }}
          # The broker's own word for it, from this boot. A TCP connect is not
          # enough: Docker publishes the port before RabbitMQ is listening, and
          # a connection then succeeds and is immediately reset.
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for i in $(seq 1 60); do
            if docker logs --since "$started" broker 2>&1 | grep -q "Server startup complete"; then
              echo "the broker is up"
              exit 0
            fi
            sleep 3
          done
          echo "::error::the broker never became ready"
          docker logs broker
          exit 1

      - name: Certificates, and a broker that speaks TLS
        # The one example that needs a listener of its own. These are the two
        # commands its README gives you, run here for the same reason: a TLS
        # broker cannot be started until the certificates it serves exist.
        run: |
          go run github.com/AceMQ-Company/acemq-go-amqp/cmd/acemq-certs@v0.7.2 \
            --out certs --broker localhost --days 1
          # The generator writes keys 0600, which is right for a key and wrong
          # for a container running as another user. RabbitMQ reports an
          # unreadable key as a listener that failed to start.
          chmod 644 certs/server.key
          docker run -d --name tls-broker \
            -e HOME=/tmp \
            -v "$PWD/certs:/certs:ro" \
            -v "$PWD/certs/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro" \
            -p 5671:5671 \
            rabbitmq:${{ matrix.broker }}
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for i in $(seq 1 60); do
            if docker logs --since "$started" tls-broker 2>&1 | grep -q "Server startup complete"; then
              echo "the TLS broker is up"
              exit 0
            fi
            sleep 3
          done
          echo "::error::the TLS broker never became ready"
          docker logs tls-broker
          exit 1

      - name: A broker that may be put into alarm
        # advanced/07-health-when-the-broker-blocks drops this node's memory high
        # watermark until RabbitMQ really blocks the connection. An alarm belongs
        # to the node, not to one connection: every publisher on the broker that
        # raises it is refused for as long as it lasts.
        #
        # On the shared broker above, that would fail whichever example happened
        # to be running at the time -- and it would fail them with "publishing is
        # paused", which reads like a defect in the example that reported it
        # rather than like a neighbour holding an alarm. Ordering would not save
        # it either: the loop below runs advanced before basic and intermediate,
        # so the alarm-raising example runs seventh of nineteen whatever it is
        # numbered.
        #
        # The example puts the watermark back in a deferred call that runs even
        # when it fails, so this container is not sacrificial. It is here so that
        # the one case that defeats a deferred restore -- the process being
        # killed outright -- costs this job one broker rather than twelve
        # examples.
        run: |
          docker run -d --name alarm-broker \
            -e HOME=/tmp \
            -p 5673:5672 \
            rabbitmq:${{ matrix.broker }}
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for i in $(seq 1 60); do
            if docker logs --since "$started" alarm-broker 2>&1 | grep -q "Server startup complete"; then
              echo "the alarm broker is up"
              exit 0
            fi
            sleep 3
          done
          echo "::error::the alarm broker never became ready"
          docker logs alarm-broker
          exit 1

      - name: Run every example
        env:
          ACEMQ_URL: amqp://guest:guest@localhost:5672/
          ACEMQ_AMQPS_URL: amqps://guest:guest@localhost:5671/
          # Absolute, because the loop below runs each example from inside its
          # own directory. A relative "certs" resolved against the repository
          # root while examples were run as ./<dir> from here, and silently
          # stopped resolving when they started being run from within their own
          # directory instead -- the TLS example then looked for certificates
          # beside its own main.go and failed there rather than here.
          ACEMQ_CERTS: ${{ github.workspace }}/certs
          # The broker advanced/07-health-when-the-broker-blocks is allowed to
          # put into alarm, and the container it reaches rabbitmqctl through.
          # Separate from ACEMQ_URL on purpose: an alarm stops every publisher on
          # its node, so this example must never be pointed at the shared broker.
          ACEMQ_ALARM_URL: amqp://guest:guest@localhost:5673/
          ACEMQ_ALARM_CONTAINER: alarm-broker
          # The recovery example waits for somebody to restart the broker.
          # Nobody is standing by here, so it runs briefly and proves it
          # publishes and consumes rather than proving it recovers — the
          # library's own suite restarts a broker for that.
          ACEMQ_EXAMPLE_SECONDS: "5"
        run: |
          set -o pipefail

          # Every ACEMQ_* variable above has to be a URL, a plain number, or an
          # absolute path. Nothing relative, and this is why.
          #
          # The loop below runs each example from inside its own directory, which
          # it must: advanced/06-tracing is a module of its own and `go run
          # ./advanced/06-tracing` from the root fails. That change resolved
          # relative paths against the example instead of against the repository
          # root, silently and differently for every example. ACEMQ_CERTS was
          # "certs" and stayed "certs", so the TLS example started looking for
          # certificates beside its own main.go. Nothing failed at the point of
          # the change; one example just began failing for a reason that read
          # like a broken example rather than like a moved working directory.
          #
          # Checking every ACEMQ_* variable rather than a list of the ones known
          # to be paths is the point: the next path-valued variable added to the
          # env above cannot be relative without stopping here and asking.
          for name in $(env | sed -n 's/^\(ACEMQ_[A-Z_]*\)=.*/\1/p' | sort); do
            # The exceptions, named one at a time rather than by shape. A Docker
            # container name is a bare word and so is a relative path, so there
            # is no pattern that admits one without admitting the other -- and
            # admitting the other is the bug this whole check exists for. Adding
            # a name here is a decision somebody makes and a reviewer sees.
            case "$name" in
              ACEMQ_ALARM_CONTAINER) continue ;;
            esac
            eval "value=\$$name"
            case "$value" in
              amqp://*|amqps://*|http://*|https://*) ;;
              /*) ;;
              *[!0-9]*)
                echo "::error::$name is \"$value\", which is neither a URL, a number, nor an absolute path. Each example is run from inside its own directory, so a relative path resolves against the example rather than against the repository root. If it names a path, make it absolute in the env block of this step, by prefixing it with the github.workspace expression."
                exit 1
                ;;
              *) ;;
            esac
          done

          failed=""
          # Every directory holding a main.go, found rather than listed, so an
          # example added without touching this file is still run.
          for dir in $(find basic intermediate advanced -name main.go -exec dirname {} \; | sort); do
            echo "::group::$dir"
            # Run from inside the directory rather than as ./$dir from here.
            # Both resolve the same way for an example in the root module, and
            # only this one works for advanced/06-tracing, which has a go.mod of
            # its own: `go run ./advanced/06-tracing` from the root fails with
            # "directory not in main module", which reads like a missing example
            # rather than like a second module.
            if ! (cd "$dir" && go run .); then
              failed="$failed $dir"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::these examples failed:$failed"
            exit 1
          fi

      - name: Check every example actually ran
        # A find that matches nothing would make the step above pass without
        # running anything at all, which is the quiet way a suite stops testing.
        run: |
          count=$(find basic intermediate advanced -name main.go | wc -l | tr -d ' ')
          if [ "$count" -lt 19 ]; then
            echo "::error::found only $count examples; expected at least 19"
            exit 1
          fi
          echo "$count examples"

      - name: What the brokers said, if anything went wrong
        if: failure()
        run: |
          docker logs broker
          docker logs tls-broker || true
          docker logs alarm-broker || true
          # Whether the alarm was cleared. A broker still in alarm here means the
          # restore did not run, which is a different finding from the example
          # failing an assertion and is the one that would mislead a rerun.
          docker exec -e HOME=/var/lib/rabbitmq alarm-broker rabbitmqctl status | grep -A3 -i alarm || true

  tracks-the-release:
    name: the pins are the newest releases
    runs-on: ubuntu-latest
    # A job of its own rather than another step above, deliberately. A stale pin
    # and a broken example are different findings and both are worth having: the
    # examples still build and still run whatever this job concludes, so a red X
    # here reads as "a pinned version is old", never as "we have no idea whether
    # any of this works".
    #
    # It inherits the workflow's triggers, so it runs on the Monday cron as well
    # as on push. That is the run it exists for: a release moves underneath this
    # repository without a commit landing here, and only something on a timer
    # will ever notice.
    steps:
      - uses: actions/checkout@v4

      - name: Every pinned AceMQ module is the newest released one
        # Hard failure rather than a warning, and the argument is worth writing
        # down because the other choice is tempting.
        #
        # This repository exists to prove the current release works. Pinned to an
        # older one it proves something about a version nobody imports any more,
        # and it does that in a green build -- which is worse than no check at
        # all, because a green build is read as an answer. Three of these
        # examples repositories were once found sitting releases behind, all of
        # them green the whole time.
        #
        # The cost of failing hard is real. A library release legitimately lands
        # before the examples are updated, and during that window this job goes
        # red on a repository nobody has broken. But that window is precisely the
        # thing being measured, the fix is a `go get` and a commit, and a warning
        # buried in a log is what let the drift go unnoticed for releases at a
        # time in the first place.
        #
        # Go is the awkward one, and the awkwardness is the nested modules. Each
        # of codec/avro, codec/protobuf, codec/toml, codec/yaml and
        # telemetry/otel is a module in its own right with its own path-prefixed
        # tags, so telemetry/otel's newest release is the newest
        # telemetry/otel/v* tag and has nothing whatever to do with v*. They are
        # genuinely not in lockstep, and a release that happens to leave them all
        # on one number is not evidence that they are: telemetry/otel spent
        # v0.7.1 on its own, for an OpenTelemetry bump the core never needed,
        # while the root module stayed at v0.7.0 and both were current. So each
        # module is compared against its own tag line, and nothing here demands
        # one version number across all of them -- that would be wrong, not
        # strict.
        #
        # What is deliberately not covered:
        #   - go.sum. It is derived from go.mod and `go build` fails when the two
        #     disagree, so it cannot drift on its own.
        #   - Library modules this repository does not import. A codec nothing
        #     here uses is not this repository's business to track.
        # Everything else is: the go.mod files are found rather than listed, so a
        # second nested example module added later is covered without anyone
        # remembering to come back here.
        run: |
          # The tag list once, not once per module.
          git ls-remote --tags https://github.com/AceMQ-Company/acemq-go-amqp \
            | grep -v '\^{}' | sed 's#.*refs/tags/##' > library-tags
          if [ ! -s library-tags ]; then
            echo "::error::no tags found on acemq-go-amqp, so the pins could not be checked"
            exit 1
          fi

          # $1 is the tag prefix: empty for the root module, "telemetry/otel/"
          # and the like for a nested one. Matched by exact prefix rather than by
          # regex so that an empty prefix means the root tags only.
          newest_release() {
            awk -v prefix="$1" '
              index($0, prefix "v") == 1 {
                version = substr($0, length(prefix) + 2)
                if (version ~ /^[0-9]+\.[0-9]+\.[0-9]+$/) { print version }
              }' library-tags | sort -V | tail -1
          }

          : > stale
          for gomod in $(find . -name go.mod | sort); do
            # $1 and $2 of a require line are the module path and the version as
            # written. Taking them as fields rather than by regex means a
            # `replace` directive comes through as "=>" and is reported below
            # rather than quietly skipped.
            awk '$1 ~ /^github\.com\/AceMQ-Company\/acemq-go-amqp(\/|$)/ { print $1, $2 }' "$gomod" \
              | sort -u \
              | while read -r module pinned; do
                  suffix=${module#github.com/AceMQ-Company/acemq-go-amqp}
                  suffix=${suffix#/}
                  prefix=""
                  [ -n "$suffix" ] && prefix="$suffix/"

                  if ! printf '%s\n' "$pinned" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
                    echo "$gomod holds $module at \"$pinned\", which is not a released version. A pseudo-version or a replace directive means these examples are not running against a release at all. Edit $gomod." >> stale
                    continue
                  fi

                  newest=$(newest_release "$prefix")
                  if [ -z "$newest" ]; then
                    echo "$gomod requires $module but acemq-go-amqp carries no ${prefix}v* release tag, so the pin could not be checked. Edit $gomod." >> stale
                    continue
                  fi
                  if [ "${pinned#v}" != "$newest" ]; then
                    echo "$gomod pins $module at ${pinned#v} but the newest release is $newest. Edit the require line in $gomod and set it to v$newest, then run the examples against it." >> stale
                  fi
                done
          done

          # The certificate generator is pinned in this file rather than in a
          # go.mod, and it is the same root module, so it goes stale the same way
          # and nothing above would see it.
          root_newest=$(newest_release "")
          certs_pin=$(grep -oE 'acemq-certs@v[0-9]+\.[0-9]+\.[0-9]+' .github/workflows/ci.yml \
                        | head -1 | sed 's/.*@v//')
          if [ -z "$certs_pin" ]; then
            echo ".github/workflows/ci.yml no longer runs acemq-certs at a pinned @v<version>, so it could not be checked. Edit .github/workflows/ci.yml." >> stale
          elif [ "$certs_pin" != "$root_newest" ]; then
            echo ".github/workflows/ci.yml runs acemq-certs at $certs_pin but the newest release is $root_newest. Edit the go run acemq-certs line in .github/workflows/ci.yml and set it to v$root_newest." >> stale
          fi

          if [ -s stale ]; then
            # One annotation per finding, so each one arrives whole rather than
            # as a heading with the detail folded away in the log.
            while read -r line; do
              echo "::error::$line"
            done < stale
            exit 1
          fi
          echo "every AceMQ module pin is the newest release of that module"
