# A broker for the examples. Plain AMQP on 5672; the TLS example brings its own.
services:
  broker:
    image: rabbitmq:4-alpine
    environment:
      # RabbitMQ writes its Erlang cookie under HOME, and the default in this
      # image is not writable on every Docker setup. Pointing it at /tmp is the
      # difference between a broker that starts and one that dies with an
      # "eacces" nobody can interpret.
      HOME: /tmp
    ports:
      - "5672:5672"
      - "15672:15672"

  # The TLS listener advanced/05-development-certificates needs, holding
  # certificates generated on this machine. It is behind a profile because it
  # cannot start until they exist:
  #
  #   go run github.com/AceMQ-Company/acemq-go-amqp/cmd/acemq-certs@v0.7.0 \
  #     --out certs --broker localhost
  #   chmod 644 certs/server.key
  #   docker compose --profile tls up -d
  #
  # The chmod is because the generator writes keys 0600, which is right for a
  # key and wrong for a container running as another user. RabbitMQ reports an
  # unreadable key as a listener that failed to start.
  tls-broker:
    image: rabbitmq:4-alpine
    profiles: [tls]
    environment:
      HOME: /tmp
    ports:
      - "5671:5671"
    volumes:
      # rabbitmq.conf is written by the same command, and points at /certs.
      - ./certs:/certs:ro
      - ./certs/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

  # A broker advanced/07-health-when-the-broker-blocks can put into a memory
  # alarm without taking anything else down with it:
  #
  #   docker compose --profile alarm up -d
  #   go run ./advanced/07-health-when-the-broker-blocks
  #
  # An alarm is a property of the node rather than of one connection. Every
  # publisher on the broker that raises it stops being served for as long as it
  # lasts, so an example that raised one on the shared broker above would fail
  # whichever other example happened to be running, and would look innocent
  # while doing it.
  #
  # Named rather than left to compose, because the example reaches the node
  # through `docker exec <name> rabbitmqctl`: an alarm is set on the node and
  # there is no AMQP for it.
  alarm-broker:
    image: rabbitmq:4-alpine
    container_name: acemq-alarm-broker
    profiles: [alarm]
    environment:
      HOME: /tmp
    ports:
      - "5673:5672"
